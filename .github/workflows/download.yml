name: Download Kthena v1.0.0 ARM64 Images Tar
on: workflow_dispatch

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Save Images
        run: |
          # 定义镜像列表
          IMG_CONTROLLER="ghcr.io/volcano-sh/kthena-controller:v1.0.0"
          IMG_ROUTER="ghcr.io/volcano-sh/kthena-router:v1.0.0"

          # 尝试以 arm64 拉取；若无 arm64 manifest 则回退至默认拉取
          docker pull --platform linux/arm64 $IMG_CONTROLLER || docker pull $IMG_CONTROLLER
          docker pull --platform linux/arm64 $IMG_ROUTER || docker pull $IMG_ROUTER

          # 打包镜像
          docker save -o kthena-v1.0.0-arm64.tar $IMG_CONTROLLER $IMG_ROUTER

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kthena-v1.0.0-arm64
          path: kthena-v1.0.0-arm64.tar
