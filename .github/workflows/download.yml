name: Download Python 3.11 Alpine ARM64 Image Tar
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Pull and Save ARM64 Image
        run: |
          # 明确指定拉取 arm64 架构的 python:3.11-alpine 镜像
          docker pull --platform linux/arm64 python:3.11-alpine
          docker save -o python-3.11-alpine-arm64.tar python:3.11-alpine

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-3.11-alpine-arm64
          path: python-3.11-alpine-arm64.tar
