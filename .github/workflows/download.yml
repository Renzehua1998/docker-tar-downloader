name: Download Golang 1.19 ARM64 Image Tar
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Pull and Save ARM64 Image
        run: |
          # 明确指定拉取 arm64 架构的 golang:1.19 镜像
          docker pull --platform linux/arm64 golang:1.19
          docker save -o golang-1.19-arm64.tar golang:1.19

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: golang-1.19-arm64
          path: golang-1.19-arm64.tar
