name: Download Kthena v1.0.0 ARM64 Images Tar
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Pull and Save ARM64 Images
        run: |
          # 1. 明确指定 arm64 架构拉取 2 个 Kthena 镜像
          docker pull --platform linux/arm64 ghcr.io/volcano-sh/kthena-controller:v1.0.0
          docker pull --platform linux/arm64 ghcr.io/volcano-sh/kthena-router:v1.0.0

          # 2. 将 2 个镜像打包到同一个 tar 文件中
          docker save -o kthena-v1.0.0-arm64.tar \
            ghcr.io/volcano-sh/kthena-controller:v1.0.0 \
            ghcr.io/volcano-sh/kthena-router:v1.0.0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kthena-v1.0.0-arm64
          path: kthena-v1.0.0-arm64.tar
